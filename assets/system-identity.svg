<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B1A" />
      <stop offset="100%" stop-color="#050014" />
    </linearGradient>

    <pattern id="card-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    .key-label { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px; fill: #8B5CF6; font-weight: 700; }
    .val-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #E2E8F0; font-weight: 500; }
    .val-highlight { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px; fill: #00D9FF; font-weight: 600; }
    .val-accent { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px; fill: #A3FF12; font-weight: 600; }
    .card-title { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: 800; fill: #00D9FF; letter-spacing: 2px; }
  </style>

  <!-- Container -->
  <rect width="900" height="240" rx="10" fill="url(#card-bg)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />
  <rect width="900" height="240" rx="10" fill="url(#card-grid)" />

  <!-- Header Bar -->
  <path d="M 0 10 Q 0 0 10 0 L 890 0 Q 900 0 900 10 L 900 40 L 0 40 Z" fill="#050014" fill-opacity="0.8" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
  <text x="25" y="26" class="card-title">01 // SYSTEM IDENTITY ARCHITECTURE</text>
  <rect x="740" y="12" width="135" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1" />
  <text x="750" y="26" font-family="monospace" font-size="11" fill="#8B5CF6" font-weight="700">SEC_LEVEL: ALPHA</text>

  <!-- Grid Layout -->
  <!-- Column 1: Core Credentials -->
  <g transform="translate(25, 60)">
    <text x="0" y="18" class="key-label">OPERATOR_ID  :</text>
    <text x="135" y="18" class="val-text">Ishmeet Kaur</text>

    <text x="0" y="45" class="key-label">ACADEMIC_INST:</text>
    <text x="135" y="45" class="val-text">VIT Bhopal University (B.Tech CSE - Cyber Security)</text>

    <text x="0" y="72" class="key-label">GRADUATION   :</text>
    <text x="135" y="72" class="val-highlight">2027 (CGPA: 8.23 / 10.0)</text>

    <text x="0" y="99" class="key-label">PRIMARY_ROLE :</text>
    <text x="135" y="99" class="val-accent">AI Security Engineer &amp; Threat Detection Researcher</text>

    <text x="0" y="126" class="key-label">EXPERIENCE   :</text>
    <text x="135" y="126" class="val-text">Cloud Security Intern @ Arglin Tech (May–June 2026)</text>

    <text x="0" y="153" class="key-label">LOCATION     :</text>
    <text x="135" y="153" class="val-text">India [IN] // Remote &amp; On-Site Operations</text>
  </g>

  <!-- Divider Line -->
  <line x1="560" y1="50" x2="560" y2="220" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4" />

  <!-- Column 2: Key Operational Vectors -->
  <g transform="translate(585, 60)">
    <text x="0" y="18" class="key-label">CORE DIRECTIVES &amp; SPECS</text>

    <g transform="translate(0, 32)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="280" height="26" rx="4" fill="#050014" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.3" />
      <text x="10" y="17" font-family="monospace" font-size="11" fill="#00D9FF">⚡ SOC &amp; LLM SECURITY AUTOMATION</text>

      <!-- Item 2 -->
      <rect x="0" y="32" width="280" height="26" rx="4" fill="#050014" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />
      <text x="10" y="49" font-family="monospace" font-size="11" fill="#8B5CF6">🔬 3x IEEE PUBLISHED AI RESEARCH</text>

      <!-- Item 3 -->
      <rect x="0" y="64" width="280" height="26" rx="4" fill="#050014" stroke="#A3FF12" stroke-width="1" stroke-opacity="0.3" />
      <text x="10" y="81" font-family="monospace" font-size="11" fill="#A3FF12">🚀 AMAZON ML SUMMER SCHOOL '26 (TOP 2.2%)</text>

      <!-- Item 4 -->
      <rect x="0" y="96" width="280" height="26" rx="4" fill="#050014" stroke="#FFB000" stroke-width="1" stroke-opacity="0.3" />
      <text x="10" y="113" font-family="monospace" font-size="11" fill="#FFB000">👑 IEEE CONTENT LEAD &amp; OWASP EVENT LEAD</text>
    </g>
  </g>
</svg>
