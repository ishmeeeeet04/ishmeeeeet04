<svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0118"/>
      <stop offset="50%" stop-color="#1E1033"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#A855F7" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="900" height="320" rx="16" fill="url(#bg)"/>
  <rect width="900" height="320" rx="16" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="897" height="317" rx="16" fill="none" stroke="url(#border)" stroke-width="2"/>

  <rect x="24" y="24" width="852" height="44" rx="10" fill="#150A28"/>
  <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
  <circle cx="68" cy="46" r="6" fill="#FFBD2E"/>
  <circle cx="88" cy="46" r="6" fill="#27C93F"/>
  <text x="450" y="51" font-family="JetBrains Mono, monospace" font-size="14" fill="#9F7AEA" text-anchor="middle">ishmeet@secure-systems: ~</text>

  <g font-family="JetBrains Mono, monospace" font-size="20" fill="#E9D5FF">
    <text x="48" y="115" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.4s" fill="freeze"/>
      <tspan fill="#C084FC">$</tspan> whoami
    </text>
    <text x="48" y="150" opacity="0" font-size="24" font-weight="bold">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.5s" fill="freeze"/>
      <tspan fill="#F5F3FF">Ishmeet Kaur</tspan><tspan fill="#C026D3"> — Software &amp; AI/ML Engineer</tspan>
    </text>

    <text x="48" y="195" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.4s" fill="freeze"/>
      <tspan fill="#C084FC">$</tspan> cat focus.txt
    </text>
    <text x="48" y="228" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/>
      <tspan fill="#D8B4FE">Cybersecurity · Digital Forensics · Applied ML · Full-Stack Systems</tspan>
    </text>

    <text x="48" y="273" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.4s" fill="freeze"/>
      <tspan fill="#C084FC">$</tspan> status --current
    </text>
    <text x="48" y="298" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4.5s" dur="0.5s" fill="freeze"/>
      <tspan fill="#27C93F">●</tspan> <tspan fill="#F5F3FF">Building secure, explainable AI systems</tspan>
      <rect x="565" y="285" width="10" height="18" fill="#C026D3">
        <animate attributeName="opacity" values="1;0;1" dur="1s" begin="5s" repeatCount="indefinite"/>
      </rect>
    </text>
  </g>
</svg>
