<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="55%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#0D0417"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#B026FF"/>
      <stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>

    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D0417" stop-opacity="1"/>
      <stop offset="12%" stop-color="#0D0417" stop-opacity="0"/>
      <stop offset="88%" stop-color="#0D0417" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0417" stop-opacity="1"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#1B2A4A" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M0,60 H180 L210,90 H420" stroke="#00F0FF">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M1200,230 H1020 L990,200 H760" stroke="#FF2E97">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.1s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M0,250 H140 L165,225 H320 L345,250 H520" stroke="#B026FF">
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="5s" begin="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M1200,45 H1060 L1035,70 H880" stroke="#39FF14">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <circle cx="420" cy="90" r="3.5" fill="#00F0FF"/>
    <circle cx="760" cy="200" r="3.5" fill="#FF2E97"/>
    <circle cx="520" cy="250" r="3.5" fill="#B026FF"/>
    <circle cx="880" cy="70" r="3.5" fill="#39FF14"/>
  </g>

  <!-- matrix rain columns -->
  <g font-family="Fira Code, monospace" font-size="13" fill="#1FE3A8" opacity="0.55">
    <g>
      <text x="60" y="0">01</text><text x="60" y="16">FF</text><text x="60" y="32">A3</text><text x="60" y="48">10</text>
      <animateTransform attributeName="transform" type="translate" values="0,-40; 0,300" dur="6s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="150" y="0">C2</text><text x="150" y="16">01</text><text x="150" y="32">9B</text><text x="150" y="48">E4</text>
      <animateTransform attributeName="transform" type="translate" values="0,-40; 0,300" dur="7.5s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="1080" y="0">7A</text><text x="1080" y="16">FF</text><text x="1080" y="32">02</text><text x="1080" y="48">D1</text>
      <animateTransform attributeName="transform" type="translate" values="0,-40; 0,300" dur="6.8s" begin="0.4s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="1140" y="0">11</text><text x="1140" y="16">0F</text><text x="1140" y="32">AC</text><text x="1140" y="48">3E</text>
      <animateTransform attributeName="transform" type="translate" values="0,-40; 0,300" dur="8.2s" begin="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- corner terminal brackets -->
  <g font-family="Fira Code, monospace" font-size="22" font-weight="700" filter="url(#softGlow)">
    <text x="30" y="45" fill="#00F0FF" opacity="0.85">&gt;&gt;&gt;</text>
    <text x="1112" y="265" fill="#FF2E97" opacity="0.85">&lt;&lt;&lt;</text>
  </g>

  <!-- title block -->
  <g text-anchor="middle" font-family="Fira Code, monospace">
    <text x="600" y="140" font-size="54" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="4">
      ISHMEET KAUR
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3.2s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="182" font-size="16" fill="#7DF9FF" opacity="0.9">
      
    </text>

    <text x="600" y="212" font-size="17" fill="#E6E6E6">
      <tspan fill="#39FF14">Cybersecurity Engineer</tspan>
      <tspan fill="#8B8B9A"> · </tspan>
      <tspan fill="#B026FF">AI/ML Builder</tspan>
      <tspan fill="#8B8B9A"> · </tspan>
      <tspan fill="#FF2E97">Digital Forensics</tspan>
    </text>

    <rect x="826" y="200" width="10" height="16" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bottom scan line -->
  <rect x="0" y="292" width="1200" height="2" fill="#00F0FF" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="300" fill="url(#edgeFade)"/>
</svg>
