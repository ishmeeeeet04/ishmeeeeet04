<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skills-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050014" />
      <stop offset="100%" stop-color="#080B1A" />
    </linearGradient>
  </defs>

  <style>
    .header-title { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: 800; fill: #00D9FF; letter-spacing: 2px; }
    .cat-title { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 12px; font-weight: 700; fill: #8B5CF6; letter-spacing: 1px; }
    .badge-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #E2E8F0; }
    .badge-hl { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #00D9FF; }
    .badge-accent { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #A3FF12; }
  </style>

  <!-- Background -->
  <rect width="900" height="300" rx="10" fill="url(#skills-bg)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />

  <!-- Header Bar -->
  <path d="M 0 10 Q 0 0 10 0 L 890 0 Q 900 0 900 10 L 900 40 L 0 40 Z" fill="#080B1A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
  <text x="25" y="26" class="header-title">03 // TACTICAL SECURITY &amp; ENGINEERING ARSENAL</text>

  <!-- Row 1: Programming Languages -->
  <g transform="translate(25, 55)">
    <text x="0" y="16" class="cat-title">LANGUAGES &amp; CORE:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="12" y="16" class="badge-hl">Python</text>

      <rect x="85" y="0" width="60" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="97" y="16" class="badge-text">C++</text>

      <rect x="155" y="0" width="55" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="167" y="16" class="badge-text">SQL</text>

      <rect x="220" y="0" width="60" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="232" y="16" class="badge-text">Java</text>

      <rect x="290" y="0" width="45" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="304" y="16" class="badge-text">C</text>

      <rect x="345" y="0" width="95" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="357" y="16" class="badge-text">JavaScript</text>

      <rect x="450" y="0" width="105" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="462" y="16" class="badge-text">HTML5 / CSS3</text>
    </g>
  </g>

  <!-- Row 2: AI & ML Frameworks -->
  <g transform="translate(25, 100)">
    <text x="0" y="16" class="cat-title">AI / ML &amp; DATA SCI:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="95" height="24" rx="4" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
      <text x="10" y="16" class="badge-accent">TensorFlow</text>

      <rect x="105" y="0" width="95" height="24" rx="4" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
      <text x="15" y="16" class="badge-accent">Scikit-learn</text>

      <rect x="210" y="0" width="70" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="222" y="16" class="badge-text">NumPy</text>

      <rect x="290" y="0" width="70" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="302" y="16" class="badge-text">Pandas</text>

      <rect x="370" y="0" width="60" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="382" y="16" class="badge-text">NLTK</text>

      <rect x="440" y="0" width="65" height="24" rx="4" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
      <text x="452" y="16" class="badge-hl">SHAP</text>

      <rect x="515" y="0" width="95" height="24" rx="4" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
      <text x="527" y="16" class="badge-hl">ChromaDB</text>

      <rect x="620" y="0" width="70" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="632" y="16" class="badge-text">TF-IDF</text>
    </g>
  </g>

  <!-- Row 3: LLM & AI Security -->
  <g transform="translate(25, 145)">
    <text x="0" y="16" class="cat-title">AI &amp; LLM SECURITY:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="125" height="24" rx="4" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
      <text x="10" y="16" class="badge-hl">Gemini LLM API</text>

      <rect x="135" y="0" width="105" height="24" rx="4" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
      <text x="145" y="16" class="badge-hl">RAG Pipeline</text>

      <rect x="250" y="0" width="150" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="260" y="16" class="badge-text">Prompt Engineering</text>

      <rect x="410" y="0" width="155" height="24" rx="4" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
      <text x="420" y="16" class="badge-accent">LangChain Integration</text>

      <rect x="575" y="0" width="115" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="585" y="16" class="badge-text">Explainable AI</text>
    </g>
  </g>

  <!-- Row 4: Cybersecurity & SOC -->
  <g transform="translate(25, 190)">
    <text x="0" y="16" class="cat-title">CYBERSECURITY &amp; SOC:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="12" y="16" class="badge-text">Kali Linux</text>

      <rect x="95" y="0" width="125" height="24" rx="4" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
      <text x="105" y="16" class="badge-hl">VirusTotal API</text>

      <rect x="230" y="0" width="170" height="24" rx="4" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
      <text x="240" y="16" class="badge-accent">MITRE ATT&amp;CK Framework</text>

      <rect x="410" y="0" width="85" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="422" y="16" class="badge-text">Burp Suite</text>

      <rect x="505" y="0" width="60" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="517" y="16" class="badge-text">DVWA</text>

      <rect x="575" y="0" width="115" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="585" y="16" class="badge-text">Isolation Forest</text>
    </g>
  </g>

  <!-- Row 5: Backend & Cloud -->
  <g transform="translate(25, 235)">
    <text x="0" y="16" class="cat-title">BACKEND &amp; CLOUD:</text>
    <g transform="translate(170, 0)">
      <rect x="0" y="0" width="75" height="24" rx="4" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
      <text x="12" y="16" class="badge-hl">FastAPI</text>

      <rect x="85" y="0" width="60" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="97" y="16" class="badge-text">Flask</text>

      <rect x="155" y="0" width="85" height="24" rx="4" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
      <text x="167" y="16" class="badge-text">REST APIs</text>

      <rect x="250" y="0" width="60" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="260" y="16" class="badge-text">MySQL</text>

      <rect x="320" y="0" width="65" height="24" rx="4" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
      <text x="330" y="16" class="badge-text">SQLite</text>

      <rect x="395" y="0" width="95" height="24" rx="4" fill="#080B1A" stroke="#FFB000" stroke-width="1" />
      <text x="407" y="16" class="badge-text" fill="#FFB000">AWS Cloud</text>

      <rect x="500" y="0" width="145" height="24" rx="4" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
      <text x="510" y="16" class="badge-accent">GitHub Actions CI/CD</text>
    </g>
  </g>
</svg>
