<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ach-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050014" />
      <stop offset="100%" stop-color="#090B1E" />
    </linearGradient>
  </defs>

  <style>
    .ach-title { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: 800; fill: #00D9FF; letter-spacing: 2px; }
    .card-label { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; fill: #A3FF12; font-weight: 700; }
    .card-h1 { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 800; fill: #FFFFFF; }
    .card-body { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #CBD5E1; }
  </style>

  <rect width="900" height="220" rx="10" fill="url(#ach-bg)" stroke="#A3FF12" stroke-width="1" stroke-opacity="0.3" />

  <!-- Header Bar -->
  <path d="M 0 10 Q 0 0 10 0 L 890 0 Q 900 0 900 10 L 900 40 L 0 40 Z" fill="#080B1A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
  <text x="25" y="26" class="ach-title">06 // ACHIEVEMENT MATRIX &amp; COMMUNITY LEADERSHIP</text>

  <!-- Card 1: Amazon ML -->
  <g transform="translate(25, 55)">
    <rect width="410" height="70" rx="6" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
    <text x="15" y="22" class="card-label">🚀 FELLOWSHIP // SELECTION</text>
    <text x="15" y="42" class="card-h1">Amazon ML Summer School (2026)</text>
    <text x="15" y="58" class="card-body">Selected in top 2.2% of national applicants for intensive ML track.</text>
  </g>

  <!-- Card 2: Google Cert -->
  <g transform="translate(465, 55)">
    <rect width="410" height="70" rx="6" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
    <text x="15" y="22" class="card-label" fill="#00D9FF">📜 PROFESSIONAL CERTIFICATION</text>
    <text x="15" y="42" class="card-h1">Google IT Support Professional (2026)</text>
    <text x="15" y="58" class="card-body">Systems administration, networking, security fundamentals, troubleshooting.</text>
  </g>

  <!-- Card 3: IEEE Lead -->
  <g transform="translate(25, 135)">
    <rect width="410" height="70" rx="6" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
    <text x="15" y="22" class="card-label" fill="#8B5CF6">👑 LEADERSHIP // IEEE STUDENT BRANCH</text>
    <text x="15" y="42" class="card-h1">Content Lead — IEEE VIT Bhopal</text>
    <text x="15" y="58" class="card-body">Authored technical cyber reports; boosted branch visibility by 40%.</text>
  </g>

  <!-- Card 4: OWASP Lead -->
  <g transform="translate(465, 135)">
    <rect width="410" height="70" rx="6" fill="#080B1A" stroke="#FFB000" stroke-width="1" />
    <text x="15" y="22" class="card-label" fill="#FFB000">🛡️ LEADERSHIP // OWASP STUDENT CLUB</text>
    <text x="15" y="42" class="card-h1">Event Lead — OWASP VIT Bhopal</text>
    <text x="15" y="58" class="card-body">Led 8+ cyber/AI technical workshops; increased turnout by 35%.</text>
  </g>
</svg>
