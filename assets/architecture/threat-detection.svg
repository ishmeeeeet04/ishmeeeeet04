<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <linearGradient id="td-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050014" />
      <stop offset="100%" stop-color="#090B1E" />
    </linearGradient>
  </defs>

  <style>
    .arch-title { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 800; fill: #00D9FF; letter-spacing: 1.5px; }
    .box-title { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 10px; font-weight: 700; fill: #A3FF12; }
    .box-desc { font-family: 'Segoe UI', sans-serif; font-size: 9.5px; fill: #CBD5E1; }
  </style>

  <rect width="850" height="220" rx="8" fill="url(#td-bg)" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.3" />

  <!-- Title Bar -->
  <rect x="0" y="0" width="850" height="32" rx="8" fill="#080B1A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
  <text x="20" y="21" class="arch-title">FLAGSHIP ARCHITECTURE // AI-POWERED THREAT DETECTION &amp; LOG ANALYSIS</text>

  <!-- Step 1 -->
  <g transform="translate(20, 50)">
    <rect width="140" height="150" rx="6" fill="#080B1A" stroke="#3B82F6" stroke-width="1" />
    <rect width="140" height="24" rx="6" fill="#3B82F6" fill-opacity="0.2" />
    <text x="10" y="16" class="box-title">1. AUDIT LOG INGEST</text>
    <text x="10" y="42" class="box-desc">• Auth &amp; IAM Logs</text>
    <text x="10" y="58" class="box-desc">• System Events</text>
    <text x="10" y="74" class="box-desc">• 1,000+ Scored Logs</text>
    <text x="10" y="94" class="box-desc" fill="#00D9FF">SQLite Storage</text>
  </g>

  <polygon points="170,122 178,126 170,130" fill="#00D9FF" />
  <line x1="162" y1="126" x2="178" y2="126" stroke="#00D9FF" stroke-width="1.5" />

  <!-- Step 2 -->
  <g transform="translate(180, 50)">
    <rect width="150" height="150" rx="6" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
    <rect width="150" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.2" />
    <text x="10" y="16" class="box-title">2. 5-FEATURE ENGINE</text>
    <text x="10" y="42" class="box-desc">• User Identity</text>
    <text x="10" y="58" class="box-desc">• IP &amp; Geolocation</text>
    <text x="10" y="74" class="box-desc">• Access Resource</text>
    <text x="10" y="90" class="box-desc">• Action &amp; Frequency</text>
    <text x="10" y="108" class="box-desc" fill="#8B5CF6">Feature Vectors</text>
  </g>

  <polygon points="340,122 348,126 340,130" fill="#00D9FF" />
  <line x1="332" y1="126" x2="348" y2="126" stroke="#00D9FF" stroke-width="1.5" />

  <!-- Step 3 -->
  <g transform="translate(350, 50)">
    <rect width="150" height="150" rx="6" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
    <rect width="150" height="24" rx="6" fill="#A3FF12" fill-opacity="0.2" />
    <text x="10" y="16" class="box-title">3. ANOMALY PIPELINE</text>
    <text x="10" y="42" class="box-desc">• Isolation Forest</text>
    <text x="10" y="58" class="box-desc">• Contextual Rules</text>
    <text x="10" y="74" class="box-desc">• Precision: 87%</text>
    <text x="10" y="90" class="box-desc">• Recall: 100%</text>
    <text x="10" y="108" class="box-desc" fill="#A3FF12">NSL-KDD Tested</text>
  </g>

  <polygon points="510,122 518,126 510,130" fill="#00D9FF" />
  <line x1="502" y1="126" x2="518" y2="126" stroke="#00D9FF" stroke-width="1.5" />

  <!-- Step 4 -->
  <g transform="translate(520, 50)">
    <rect width="150" height="150" rx="6" fill="#080B1A" stroke="#FFB000" stroke-width="1" />
    <rect width="150" height="24" rx="6" fill="#FFB000" fill-opacity="0.2" />
    <text x="10" y="16" class="box-title">4. HARDENED REST API</text>
    <text x="10" y="42" class="box-desc">• 8 Flask Endpoints</text>
    <text x="10" y="58" class="box-desc">• CORS Hardened</text>
    <text x="10" y="74" class="box-desc">• 13 Automated Tests</text>
    <text x="10" y="90" class="box-desc">• GitHub Actions CI</text>
    <text x="10" y="108" class="box-desc" fill="#FFB000">Production Build</text>
  </g>

  <polygon points="680,122 688,126 680,130" fill="#00D9FF" />
  <line x1="672" y1="126" x2="688" y2="126" stroke="#00D9FF" stroke-width="1.5" />

  <!-- Step 5 -->
  <g transform="translate(690, 50)">
    <rect width="140" height="150" rx="6" fill="#080B1A" stroke="#00D9FF" stroke-width="1" />
    <rect width="140" height="24" rx="6" fill="#00D9FF" fill-opacity="0.2" />
    <text x="10" y="16" class="box-title">5. LIVE DASHBOARD</text>
    <text x="10" y="42" class="box-desc">• Render Deployment</text>
    <text x="10" y="58" class="box-desc">• 6 Attack Patterns</text>
    <text x="10" y="74" class="box-desc">• Interactive Review</text>
    <text x="10" y="94" class="box-desc" fill="#00D9FF">3-Tier Severity</text>
  </g>
</svg>
