  <rect width="850" height="220" rx="8" fill="url(#phish-bg)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />

  <!-- Title Bar -->
  <rect x="0" y="0" width="850" height="32" rx="8" fill="#080B1A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
