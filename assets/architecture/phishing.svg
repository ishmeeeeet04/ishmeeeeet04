  <!-- Step 3 -->
  <g transform="translate(350, 50)">
    <rect width="150" height="150" rx="6" fill="#080B1A" stroke="#A3FF12" stroke-width="1" />
    <rect width="150" height="24" rx="6" fill="#A3FF12" fill-opacity="0.2" />
    <text x="10" y="16" class="box-title">3. 3-LAYER ML ENGINE</text>
    <text x="10" y="42" class="box-desc">• Logistic Regression</text>
