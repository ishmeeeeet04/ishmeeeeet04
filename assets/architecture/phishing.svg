  <line x1="162" y1="126" x2="178" y2="126" stroke="#00D9FF" stroke-width="1.5" />

  <!-- Step 2 -->
  <g transform="translate(180, 50)">
    <rect width="150" height="150" rx="6" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" />
    <rect width="150" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.2" />
    <text x="10" y="16" class="box-title">2. NLP &amp; FEATURE PIPELINE</text>
    <text x="10" y="42" class="box-desc">• NLTK Tokenization</text>
    <text x="10" y="58" class="box-desc">• TF-IDF Vectorization</text>
    <text x="10" y="74" class="box-desc">• Urgency Keyword Ratio</text>
    <text x="10" y="94" class="box-desc" fill="#8B5CF6">Text Normalization</text>
