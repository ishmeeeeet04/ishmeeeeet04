<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="res-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050014" />
      <stop offset="100%" stop-color="#090B1E" />
    </linearGradient>
  </defs>

  <style>
    .res-title { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: 800; fill: #00D9FF; letter-spacing: 2px; }
    .paper-id { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; fill: #8B5CF6; font-weight: 700; }
    .paper-title { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .paper-domain { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; fill: #00D9FF; }
    .status-pub { font-family: 'Segoe UI', sans-serif; font-size: 10px; font-weight: 800; fill: #A3FF12; letter-spacing: 1px; }
  </style>

  <rect width="900" height="260" rx="10" fill="url(#res-bg)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" />

  <!-- Header Bar -->
  <path d="M 0 10 Q 0 0 10 0 L 890 0 Q 900 0 900 10 L 900 40 L 0 40 Z" fill="#080B1A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.2" />
  <text x="25" y="26" class="res-title">05 // IEEE RESEARCH ARCHIVE &amp; PUBLICATIONS</text>

  <!-- Paper 1 -->
  <g transform="translate(25, 55)">
    <rect width="850" height="58" rx="6" fill="#080B1A" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.4" />
    <rect x="15" y="14" width="115" height="20" rx="4" fill="#3B82F6" fill-opacity="0.2" />
    <text x="23" y="28" class="paper-id">IEEE_REF: 001</text>
    <text x="145" y="26" class="paper-title">A Novel Approach in Malware Detection with Cryptography Based Approach Using Machine Learning</text>
    <text x="145" y="44" class="paper-domain">DOMAIN: MALWARE DETECTION // CRYPTOGRAPHY // ML</text>
    <rect x="735" y="17" width="95" height="22" rx="11" fill="#A3FF12" fill-opacity="0.15" stroke="#A3FF12" stroke-width="1" />
    <text x="745" y="32" class="status-pub">IEEE PUBLISHED</text>
  </g>

  <!-- Paper 2 -->
  <g transform="translate(25, 120)">
    <rect width="850" height="58" rx="6" fill="#080B1A" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
    <rect x="15" y="14" width="115" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.2" />
    <text x="23" y="28" class="paper-id">IEEE_REF: 002</text>
    <text x="145" y="26" class="paper-title">Enhanced Consumer Healthcare Data Protection Through AI-Driven TinyML &amp; Privacy-Preserving Techniques</text>
    <text x="145" y="44" class="paper-domain">DOMAIN: TINYML // CONSUMER HEALTHCARE // PRIVACY &amp; SECURITY</text>
    <rect x="735" y="17" width="95" height="22" rx="11" fill="#A3FF12" fill-opacity="0.15" stroke="#A3FF12" stroke-width="1" />
    <text x="745" y="32" class="status-pub">IEEE PUBLISHED</text>
  </g>

  <!-- Paper 3 -->
  <g transform="translate(25, 185)">
    <rect width="850" height="58" rx="6" fill="#080B1A" stroke="#00D9FF" stroke-width="1" stroke-opacity="0.4" />
    <rect x="15" y="14" width="115" height="20" rx="4" fill="#00D9FF" fill-opacity="0.2" />
    <text x="23" y="28" class="paper-id">IEEE_REF: 003</text>
    <text x="145" y="26" class="paper-title">Network Coding for Fault-Tolerant Transmission of Biomedical Data</text>
    <text x="145" y="44" class="paper-domain">DOMAIN: NETWORK RELIABILITY // FAULT-TOLERANT TRANSMISSION // BIOMEDICAL</text>
    <rect x="735" y="17" width="95" height="22" rx="11" fill="#A3FF12" fill-opacity="0.15" stroke="#A3FF12" stroke-width="1" />
    <text x="745" y="32" class="status-pub">IEEE PUBLISHED</text>
  </g>
</svg>
