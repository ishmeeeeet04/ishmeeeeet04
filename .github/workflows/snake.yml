name: Generate Contribution Snake Animation

on:
  schedule:
    - cron: "0 18 * * *" # Run daily at 18:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Generate snake SVGs
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-snake/github-contribution-grid-snake.svg
            github-snake/github-contribution-grid-snake-dark.svg?color_snake=#00D9FF&color_dots=#050014,#1E1035,#3B82F6,#8B5CF6,#A3FF12

      # Commit & Push snake SVGs
      - name: Push github-contribution-grid-snake.svg to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A github-snake/
          git diff --staged --quiet || (git commit -m "chore: auto-update contribution snake animation" && git push)
